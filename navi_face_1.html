    ctx.fillStyle=`rgba(48,240,195,${(.38+Math.sin(uD.blinkT*1.9+i*1.05)*.42)*alpha})`;
    ctx.beginPath();ctx.arc(lx,ly,1.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ── ORB ────────────────────────────────────────────────────
// Asymmetric breathing: slow inhale (~60%), faster exhale (~40%), organic feel
function breathRhythm(){
  const cycle=(t*.215)%(Math.PI*2); // base period
  // Shape the sin to spend more time in inhale
  const shaped=cycle<Math.PI*1.2 ? Math.sin(cycle/1.2*Math.PI/2) : -Math.sin((cycle-Math.PI*1.2)/.8*Math.PI/2);
  return shaped;
}
function drawOrb(ox,oy,r,g,b){
  const pulse=safe(.84+breathRhythm()*.16),boost=safe((1+speed*9+naviPulse*.9)*naviBright);
  const neb=nebPos[0]?nebPos[0].layers[0]:null;
  const tR=neb?Math.round(r*.97+neb.cr*.03):r,tG=neb?Math.round(g*.97+neb.cg*.03):g,tB=neb?Math.round(b*.97+neb.cb*.03):b;
  let gr;
  // LAYER 1 — outermost ambient glow
  gr=ctx.createRadialGradient(ox,oy,0,ox,oy,safe(165*pulse));gr.addColorStop(0,`rgba(${tR},${tG},${tB},${.13*boost})`);gr.addColorStop(.28,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(ox,oy,165*pulse,0,Math.PI*2);ctx.fill();
  // LAYER 2 — mid color aura
  gr=ctx.createRadialGradient(ox,oy,0,ox,oy,safe(74*pulse));gr.addColorStop(0,`rgba(${r},${g},${b},${.56*boost})`);gr.addColorStop(.42,`rgba(${r},${g},${b},.22)`);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(ox,oy,74*pulse,0,Math.PI*2);ctx.fill();
  // LAYER 3 — bright core
  gr=ctx.createRadialGradient(ox,oy,0,ox,oy,safe(38*pulse));gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.20,`rgba(${clamp(r+100,0,255)},${clamp(g+100,0,255)},${clamp(b+100,0,255)},.88)`);gr.addColorStop(.58,`rgba(${r},${g},${b},.5)`);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(ox,oy,38*pulse,0,Math.PI*2);ctx.fill();
  // ── NEW: IRIDESCENT SHIMMER — soap-bubble color shift on surface ──
  // Two offset angular gradient patches that slowly rotate, tinting the orb with rainbow sheen
  {
    const iriT=t*.08;
    const iriRad=safe(32*pulse);
    // Patch 1: magenta/cyan on one side
    const iri1X=ox+Math.cos(iriT)*10*pulse,iri1Y=oy+Math.sin(iriT)*6*pulse;
    const ig1=ctx.createRadialGradient(iri1X,iri1Y,0,iri1X,iri1Y,iriRad);
    ig1.addColorStop(0,`rgba(255,110,230,${.16*pulse})`);
    ig1.addColorStop(.5,`rgba(130,180,255,${.08*pulse})`);
    ig1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ig1;ctx.beginPath();ctx.arc(ox,oy,iriRad,0,Math.PI*2);ctx.fill();
    // Patch 2: gold/violet on opposite side, different frequency
    const iri2X=ox+Math.cos(iriT*1.37+2.1)*9*pulse,iri2Y=oy+Math.sin(iriT*1.37+2.1)*5*pulse;
    const ig2=ctx.createRadialGradient(iri2X,iri2Y,0,iri2X,iri2Y,iriRad);
    ig2.addColorStop(0,`rgba(255,220,120,${.12*pulse})`);
    ig2.addColorStop(.5,`rgba(185,130,255,${.07*pulse})`);
    ig2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ig2;ctx.beginPath();ctx.arc(ox,oy,iriRad,0,Math.PI*2);ctx.fill();
  }
  // Internal shimmer (original)
  const sAng=t*.18,sx=ox+Math.cos(sAng)*7*pulse,sy=oy+Math.sin(sAng)*4*pulse;
  const shim=ctx.createRadialGradient(sx,sy,0,ox,oy,safe(22*pulse));shim.addColorStop(0,`rgba(255,255,255,${.28*pulse})`);shim.addColorStop(.45,`rgba(${r},${g},${b},${.10*pulse})`);shim.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=shim;ctx.beginPath();ctx.arc(ox,oy,22*pulse,0,Math.PI*2);ctx.fill();
  // Rune spokes (softened opacity .18→.12, hex .10→.07)
  const orbRot=t*Math.max(0.06,flapMult)*.28;
  const orbRot2=t*Math.max(0.06,flapMult)*.56;
  ctx.save();ctx.translate(ox,oy);ctx.rotate(orbRot);ctx.strokeStyle=`rgba(${r},${g},${b},.12)`;ctx.lineWidth=.5;for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*safe(5*pulse),Math.sin(a)*safe(5*pulse));ctx.lineTo(Math.cos(a)*safe(14*pulse),Math.sin(a)*safe(14*pulse));ctx.stroke();}ctx.rotate(-orbRot2);ctx.strokeStyle=`rgba(${r},${g},${b},.07)`;ctx.beginPath();for(let i=0;i<=6;i++){const a=(i/6)*Math.PI*2,or=safe(19*pulse);i===0?ctx.moveTo(Math.cos(a)*or,Math.sin(a)*or):ctx.lineTo(Math.cos(a)*or,Math.sin(a)*or);}ctx.closePath();ctx.stroke();ctx.restore();

  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(specX,specY,18*pulse,0,Math.PI*2);ctx.fill();

  const rim=ctx.createRadialGradient(rimX,rimY,safe(28*pulse),rimX,rimY,safe(42*pulse));

  {

    ctx.beginPath();ctx.moveTo(10,-5);ctx.bezierCurveTo(30,-17,60,-23,78,-27);ctx.stroke();ctx.beginPath();ctx.moveTo(20,-21);ctx.bezierCurveTo(36,-44,58,-54,72,-43);ctx.stroke();ctx.beginPath();ctx.moveTo(34,-18);ctx.bezierCurveTo(46,-32,60,-37,68,-31);ctx.stroke();
    ctx.lineWidth=.28;ctx.globalAlpha=.42;[[22,-16,26,-32],[38,-19,42,-37],[52,-22,56,-39],[64,-24,66,-37]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});

// ── PARTICLES ──────────────────────────────────────────────
let sparks=[],rings=[],wisps=[],stardust=[];

// Normalized speed 0-1 for formulas (raw speed is pixels/frame, can be 40+)
const speedN=()=>clamp(speed/12,0,1);

function spawnSpark(ox,oy,r,g,b){
  // No sparks when calm or catching breath
  if((beh==='hover'&&!zoomiesActive)||stillnessActive||(pState==='resting'&&speed<.5)||fatigueEnd>Date.now())return;
  const sn=speedN();
  const rate=.22*MOODS[mood].sp*(1+sn*1.8)*circadian(); // night more sparks
  if(Math.random()>rate)return;
  // Trail behind movement direction — both X and Y
  const trailX=ox-velX*3;
  const trailY=oy-velY*3;
  const sp=clamp(6+sn*28,6,34);
  // Mix of tiny dots and small glows
  const tiny=Math.random()<.55;
  sparks.push({
    x:trailX+rnd(-sp,sp)*.5,
    y:trailY+rnd(-sp,sp)*.5,
    vx:rnd(-1,1)*(1+sn*1.8)-velX*.18,
    vy:rnd(-1.2,.4)*(1+sn*1.4)-velY*.18,
    life:1,
    decay:tiny?rnd(.028,.055):rnd(.016,.032),
    sz:tiny?rnd(.8,1.8):rnd(2.2,4.8),
    op:tiny?.65:.85,r,g,b
  });
}

function drawSparks(){
  sparks=sparks.filter(s=>s.life>.05);
  sparks.forEach(s=>{
    s.x+=s.vx;s.y+=s.vy;s.vy+=.018;s.life-=s.decay;
    const op=s.op||0.85;
    const rad=safe(s.sz*s.life*2.2);
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,rad);
    g.addColorStop(0,`rgba(255,255,255,${s.life*op})`);
    g.addColorStop(.38,`rgba(${s.r},${s.g},${s.b},${s.life*op*.7})`);
    g.addColorStop(1,`rgba(${s.r},${s.g},${s.b},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,rad,0,Math.PI*2);ctx.fill();
  });
}

// Wake trail — whisper-light blobs during dash
function drawWake(){
  wake=wake.filter(w=>w.life>.02);
  wake.forEach(w=>{
    w.life-=.015;
    const rad=safe(5*w.life);
    const g=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,rad);
    g.addColorStop(0,`rgba(${w.r},${w.g},${w.b},${w.life*.08})`);
    g.addColorStop(1,`rgba(${w.r},${w.g},${w.b},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(w.x,w.y,rad,0,Math.PI*2);ctx.fill();
  });
}

// Stardust — slow cross trail, calm and poetic
function spawnStardust(ox,oy,r,g,b){
  if(beh!=='cross'||Math.random()>.018)return;
  stardust.push({
    x:ox+rnd(-12,12),y:oy+rnd(-8,8),
    vx:rnd(-.25,.25),vy:rnd(-.18,.12),
    life:1,decay:rnd(.003,.007),
    r,g,b
  });
}
function drawStardust(){
  stardust=stardust.filter(s=>s.life>.04);
  stardust.forEach(s=>{
    s.x+=s.vx;s.y+=s.vy;s.life-=s.decay;
    ctx.globalAlpha=s.life*.22;
    ctx.fillStyle=`rgb(${s.r},${s.g},${s.b})`;
    ctx.beginPath();ctx.arc(s.x,s.y,safe(1.5*s.life),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function updateRings(ox,oy,r,g,b){
  // Ring emission rate scales with speaking amplitude when AI is speaking
  // Base rate .04 when speaking; amplitude up to .20 when at full volume
  const spAmp=naviControl.getSpeakingAmplitude();
  const emitRate=mood==='speaking'?(0.04+spAmp*0.16):0;
  if(emitRate>0&&Math.random()<emitRate){
    rings.push({x:ox,y:oy,rad:22,life:1,r,g,b});
  }
  rings=rings.filter(x=>x.life>0);
  ctx.save();

const MOON_SYMS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
const MOON_NAMES=['NEW MOON','WAX CRESCENT','FIRST QTR','WAX GIBBOUS','FULL MOON','WAN GIBBOUS','LAST QTR','WAN CRESCENT'];
function getMoonPhase(){
  const SYN=29.53059;
  const daysSince=(Date.now()-new Date('2000-01-06T18:14:00Z').getTime())/86400000;
  const age=((daysSince%SYN)+SYN)%SYN; // lunar age in days, 0 to 29.53
  const norm=age/SYN; // 0 to 1
  const i=Math.floor(norm*8)%8;
  // Illumination: cosine approximation. 0 at new moon, 1 at full, 0 at new again
  const illum=Math.round((1-Math.cos(norm*Math.PI*2))*50);
  const waxing=norm<0.5;
  return{
    sym:MOON_SYMS[i],
    name:MOON_NAMES[i],
    pct:illum,
    age:age,
    trend:waxing?'↑':'↓'
  };
}
function tzHM(tz){try{return new Date().toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){return'--:--';}}
function updateTime(){
  const n=new Date();
  document.getElementById('tday').textContent=DAYS[n.getDay()];
  document.getElementById('tmhm').textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
  document.getElementById('tmsec').textContent='·'+n.getSeconds().toString().padStart(2,'0');
  document.getElementById('taru').textContent=tzHM('America/Aruba');
  document.getElementById('tbtm').textContent=tzHM('Asia/Jakarta');
  const el=Date.now()-startTime,uh=Math.floor(el/3600000),um=Math.floor((el%3600000)/60000);
  document.getElementById('upt').textContent=uh.toString().padStart(2,'0')+':'+um.toString().padStart(2,'0');
  const mp=getMoonPhase();
  document.getElementById('mname').textContent=mp.name;
  // Draw the moon illumination shape based on real phase fraction (0=new, 0.5=full, 1=new)
  const p=mp.age/29.53059; // 0 to 1
  const R=10;
  let d='';
  if(p<0.005||p>0.995){d='';} // new moon — nothing lit
  else if(Math.abs(p-0.5)<0.005){ // full moon — full circle
    d=`M ${-R} 0 A ${R} ${R} 0 1 1 ${R} 0 A ${R} ${R} 0 1 1 ${-R} 0 Z`;
  }else{
    // phase angle 0..2π, controls terminator ellipse width
    const pa=p*Math.PI*2;
    const rx=Math.abs(Math.cos(pa))*R; // terminator ellipse x-radius
    const waxing=p<0.5;
    const gibbous=p>0.25&&p<0.75;
    // Start from top (0,-R), arc down the right side to (0,R), then draw terminator ellipse back to top
    // For waxing: right side lit. For waning: left side lit.
    const side=waxing?1:-1;
    // Terminator sweep: inside ellipse for crescent, outside for gibbous
    const sweep=gibbous?(waxing?0:1):(waxing?1:0);
    d=`M 0 ${-R} A ${R} ${R} 0 0 ${waxing?1:0} 0 ${R} A ${rx} ${R} 0 0 ${sweep} 0 ${-R} Z`;
  }
  document.getElementById('mlit').setAttribute('d',d);
}

// ═════════════════════════════════════════════════════════════
// ── AI CONTROL BRIDGE — WebSocket interface for Navi AI ──────
// ═════════════════════════════════════════════════════════════
// Claude/Navi AI connects to ws://localhost:8765 and sends JSON
// commands. The animation state reflects her thoughts and speech.
// If WebSocket unavailable, animation runs normally standalone.
const naviControl = (function(){
  const WS_URL='ws://localhost:8765';
  const HEARTBEAT_MS=2000;
  const RECONNECT_MS=3000;
  let ws=null,connected=false,heartbeatTimer=null;
  // Speaking amplitude from AI (0-1) — affects ring emission rate + orb pulse
  let speakingAmplitude=0;
  let speakingActive=false;
  // Named points of interest the AI can point to
  const NAMED_POIS={
    ice_giant:   ()=>({x:W*.80-W/2,y:H*.09-H*.44}),
    gas_giant:   ()=>({x:W*.07-W/2,y:H*.28-H*.44}),
    moon:        ()=>({x:W*.80+34*1.95-W/2,y:H*.09+34*1.95*.35*.72-H*.44}),
    orion:       ()=>({x:W*.38-W/2,y:H*.34-H*.44}),
    milky_way:   ()=>({x:W*.5-W/2,y:H*.3-H*.44}),
    center:      ()=>({x:0,y:0}),
    upper_left:  ()=>({x:-W*.35,y:-H*.30}),
    upper_right: ()=>({x:W*.35,y:-H*.30}),
    lower_left:  ()=>({x:-W*.35,y:H*.25}),
    lower_right: ()=>({x:W*.35,y:H*.25}),
  };
  const VALID_MOODS=['idle','listening','speaking','thinking','happy','alert','angry'];
  const VALID_BEHAVIORS=['drift','patrol','dash','hover','spiral','cross','dart_poi','loop','perch'];
  const VALID_PERSONALITIES=['exploring','resting','curious','playful','watchful'];

  function handleCommand(cmd){
    try{
      switch(cmd.type){
        case'mood':{
          if(VALID_MOODS.includes(cmd.value))setMood(cmd.value);
          break;}
        case'goto':{
          // Normalized coords (0-1) → screen offsets relative to Navi's home (W/2, H*.44)
          const tx=clamp((cmd.x||.5)*W-W/2,-W*.45,W*.45);
          const ty=clamp((cmd.y||.5)*H-H*.44,-H*.40,H*.40);
          wTgt.x=tx;wTgt.y=ty;
          lSpd=.04;bTimer=Date.now()+5000;
          // Also orient her head that way
          orientX=tx;orientY=ty;orientEnd=Date.now()+2000;
          break;}
        case'point_at':{
          let tx,ty;
          if(cmd.target&&NAMED_POIS[cmd.target]){
            const p=NAMED_POIS[cmd.target]();tx=p.x;ty=p.y;
          }else if(typeof cmd.x==='number'&&typeof cmd.y==='number'){
            tx=cmd.x*W-W/2;ty=cmd.y*H-H*.44;
          }else break;
          orientX=tx;orientY=ty;orientEnd=Date.now()+3000;
          // Also lean slightly toward it
          poiTarget={x:tx,y:ty};
          break;}
        case'behavior':{
          if(cmd.value==='zoomies'){
            if(!zoomiesActive&&!stillnessActive){
              zoomiesActive=true;zoomiesDash=0;zoomiesWindup=true;
              lastZoomDash=Date.now();naviPulse=.85;
            }
          }else if(cmd.value==='stillness'){
            if(!stillnessActive&&!zoomiesActive){
              stillnessActive=true;stillnessStart=Date.now();
            }
          }else if(cmd.value==='glide'){
            if(!glideActive)glideActive=true,glideStart=Date.now();
          }else if(cmd.value==='shimmer'){
            shimmerLife=1.0;
          }else if(cmd.value==='orbit'){
            if(!orbitActive){orbitActive=true;orbitAngle=rnd(0,Math.PI*2);orbitStart=Date.now();beh='drift';}
          }else if(VALID_BEHAVIORS.includes(cmd.value)){
            beh=cmd.value;
            if(cmd.value==='perch'){
              const m=mxR();
              watchfulPerchX=rnd(-m.x*.75,m.x*.75);
              watchfulPerchY=rnd(-m.y*.70,m.y*.50);
              wTgt.x=watchfulPerchX;wTgt.y=watchfulPerchY;
              bTimer=Date.now()+20000;lSpd=.008;
              beh='perch';
            }else{
              // Direct-set behavior; will hold for default duration
              beh=cmd.value;
              bTimer=Date.now()+8000;
            }
          }
          break;}
        case'personality':{
          if(VALID_PERSONALITIES.includes(cmd.value)){
            pState=cmd.value;pTimer=Date.now()+rnd(60000,120000);pickB();
          }
          break;}
        case'speaking_start':{
          speakingActive=true;
          if(mood!=='speaking')setMood('speaking');
          break;}
        case'speaking_stop':{
          speakingActive=false;speakingAmplitude=0;
          // Return to idle unless another mood was requested mid-speech
          if(mood==='speaking')setMood('idle');
          break;}
        case'speaking_amplitude':{
          speakingAmplitude=clamp(Number(cmd.value)||0,0,1);
          break;}
        case'event':{
          switch(cmd.value){
            case'shooting_star':{
              // Force a shooting star immediately by setting shootTimer to now
              shootTimer=Date.now();
              break;}
            case'satellite':forceRareEvent('satellite');break;
            case'comet':forceRareEvent('comet');break;
            case'supernova':forceRareEvent('supernova');break;
            case'gamma_ray_burst':forceRareEvent('gamma_ray_burst');break;
            case'bright_star':forceRareEvent('bright_star');break;
            case'galaxy':forceRareEvent('galaxy');break;
            case'cosmic_ray':forceRareEvent('cosmic_ray');break;
            case'gravity_lens':forceRareEvent('gravity_lens');break;
            case'nebula_pulse':forceRareEvent('nebula_pulse');break;
            case'ufo':if(!ufoActive)triggerUFO();break;
            case'kilonova':if(!srEv)triggerSuperRare('kilonova');break;
            case'meteor_shower':if(!srEv)triggerSuperRare('meteor_shower');break;
          }
          break;}
        case'flash':{
          // One-off color pulse overlay on Navi
          const col=cmd.color||[255,220,150];
          const dur=cmd.duration||800;
          shimmerLife=1.0;
          naviPulse=Math.max(naviPulse,.6);
          break;}
        case'look_at_navi':{
          // Return to home position
          wTgt.x=0;wTgt.y=0;lSpd=.04;bTimer=Date.now()+3000;
          break;}
        case'state_query':{
          sendState();break;}
      }
    }catch(e){console.warn('[naviControl] cmd failed:',e);}
  }

  function sendState(){
    if(!connected||!ws)return;
    try{
      const navX=(wPos.x+W/2)/W,navY=(wPos.y+H*.44)/H;
      const state={
        type:'state',
        mood,
        position:[Math.round(navX*1000)/1000,Math.round(navY*1000)/1000],
        behavior:beh,
        personality:pState,
        uptime_sec:Math.round((Date.now()-startTime)/1000),
        ufo_active:ufoActive,
        super_rare:srEv,
        rare_event:rEv,
      };
      ws.send(JSON.stringify(state));
    }catch(e){}
  }

  function connect(){
    try{
      ws=new WebSocket(WS_URL);
    }catch(e){
      setTimeout(connect,RECONNECT_MS);return;
    }
    ws.addEventListener('open',()=>{
      connected=true;
      console.log('[naviControl] Connected to',WS_URL);
      sendState(); // send initial state
      if(heartbeatTimer)clearInterval(heartbeatTimer);
      heartbeatTimer=setInterval(sendState,HEARTBEAT_MS);
    });
    ws.addEventListener('message',ev=>{
      try{
        const msg=JSON.parse(ev.data);
        if(Array.isArray(msg)){msg.forEach(handleCommand);}
        else{handleCommand(msg);}
      }catch(e){console.warn('[naviControl] bad message:',e);}
    });
    ws.addEventListener('close',()=>{
      connected=false;
      if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}
      setTimeout(connect,RECONNECT_MS);
    });
    ws.addEventListener('error',()=>{
      // onclose will fire and handle reconnect
    });
  }

  // Expose for debugging / manual testing from console
  return {
    connect,
    send:(cmd)=>handleCommand(cmd), // direct test-injection
    isConnected:()=>connected,
    getSpeakingAmplitude:()=>speakingActive?speakingAmplitude:0,
    isSpeaking:()=>speakingActive,
    NAMED_POIS,
  };
})();
// Expose on window for Python/console debugging
window.naviControl=naviControl;
// Attempt connection; silent no-op if server not running
naviControl.connect();

resize();window.addEventListener('resize',resize);setTimeout(()=>setMood('idle'),1500);pickB();frame();
})();
</script>
</body>
</html>
